<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="description" content="하루 10분 30일 생활영어 문장별 섀도잉 학습"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png?v=5" type="image/png"><link rel="apple-touch-icon" href="icon-192.png?v=5"><title>하루 10분 30일 생활영어</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color-scheme:dark;--bg:#0b1525;--panel:#14243a;--panel2:#1a2f4b;--line:#2a415c;--accent:#60d8bf;--fg:#f4f9ff;--muted:#b3c3d4}*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);margin:0}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.app{height:100dvh;display:flex;flex-direction:column}.top{display:flex;gap:10px;align-items:center;padding:11px 16px;background:#102037;border-bottom:1px solid var(--line);flex-wrap:wrap}.brand{font-weight:850;font-size:1.13rem;margin-right:auto}.brand small{font-weight:400;color:var(--muted);font-size:.77rem;margin-left:8px}.btn{border:1px solid #37516b;border-radius:9px;background:#213854;color:white;padding:8px 11px}.btn.primary{background:#1d745f;border-color:#238e75}.btn:disabled{opacity:.5;cursor:not-allowed}.layout{display:grid;grid-template-columns:minmax(300px,1.06fr) minmax(360px,1fr);min-height:0;flex:1}.left{padding:14px;overflow:auto;border-right:1px solid var(--line)}.right{min-height:0;display:flex;flex-direction:column;background:#102036}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}.video{background:black;width:100%;aspect-ratio:16/9;border-radius:10px;display:block;object-fit:contain}.videohead{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}.videohead select{max-width:100%;flex:1}.select{background:#233951;border:1px solid #476079;color:white;padding:9px;border-radius:9px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.toolbar .btn{flex:1;min-width:74px}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem}.tools select{max-width:160px}.tools label{display:flex;align-items:center;gap:6px}.note{font-size:.85rem;line-height:1.6;color:var(--muted)}.warning{color:#ffd096}.righthead{padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}.righthead h2{font-size:1rem;margin:0;flex:1;min-width:120px}.righthead input{width:145px;background:#223850;color:white;border:1px solid #45617d;padding:9px;border-radius:9px}.sentences{overflow-y:auto;flex:1;padding:10px 12px 35px;scroll-behavior:smooth}.sentence{display:flex;gap:12px;align-items:flex-start;padding:13px 11px;margin-bottom:7px;background:#162a42;border:1px solid transparent;border-radius:12px;cursor:pointer;text-align:left;width:100%;color:white}.sentence:hover{background:#1d3957}.sentence.active{border-color:var(--accent);background:#1b4145}.sentence .num{color:#9cb2c8;font-size:.8rem;min-width:30px}.sentence .content{flex:1;font-size:1rem;line-height:1.5}.sentence .tim{font-size:.75rem;color:#90a7bd;white-space:nowrap}.sentence.done .content:after{content:' ✓';color:var(--accent)}.footer{font-size:.77rem;color:#a5b9cb;padding:6px 14px;border-top:1px solid var(--line);background:#101f33}.empty{color:var(--muted);padding:30px 12px}.progress{height:5px;background:#32465e;border-radius:20px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--accent);width:0}#installBtn{display:none}@media(max-width:850px){.app{height:100dvh}.top{padding:9px 11px}.brand{font-size:1rem}.layout{display:flex;flex-direction:column}.left{flex:none;max-height:54dvh;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.card{margin-bottom:4px;padding:8px}.video{max-height:32dvh}.right{flex:1;min-height:0}.righthead{padding:9px}.sentences{padding:8px}.sentence{padding:10px 8px}.tools{font-size:.8rem}.footer{padding:4px 8px}}@media(max-height:620px) and (max-width:850px){.left{max-height:47dvh}.video{max-height:24dvh}}
 .filetools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.filetools .btn{flex:1;min-width:130px}#fileStatus{margin:7px 1px 0}</style></head><body><div class="app"><header class="top"><div class="brand"><img src="icon-192.png?v=5" alt="" style="width:32px;height:32px;border-radius:7px;vertical-align:middle;margin-right:7px">하루 10분 30일 생활영어 <small>v5 · 로컬 영상 보관형</small></div><button id="updateBtn" class="btn" title="최신 버전 확인">↻ 업데이트</button><button id="installBtn" class="btn primary">앱 설치</button></header><main class="layout"><section class="left"><div class="card"><div class="videohead"><select aria-label="일차 선택" id="lessonSelect" class="select"></select><span id="countLabel" class="note"></span></div><video id="video" class="video" controls playsinline preload="metadata"></video><div class="filetools"><button class="btn primary" id="registerAllBtn">📁 영상 여러 개 자동 등록</button><button class="btn" id="registerBtn">현재 일차 영상 등록</button><input type="file" id="multipleFiles" accept="video/mp4,video/*" multiple hidden><input type="file" id="singleFile" accept="video/mp4,video/*" hidden></div><p class="note" id="fileStatus" role="status">기기 영상 확인 중…</p><div class="progress"><div class="bar" id="progressBar"></div></div><div class="toolbar"><button class="btn" id="prev">◀ 이전</button><button class="btn primary" id="repeat">↻ 문장 반복 ON</button><button class="btn" id="next">다음 ▶</button></div><div class="tools"><label>속도 <select id="speed" class="select"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label><label><input id="continuous" type="checkbox"> 구간 연속재생</label><label><input id="autoscroll" type="checkbox" checked> 자동 스크롤</label></div><p class="note" id="warning"></p></div><div class="card"><div class="note">사용법: 기기에 보유한 영상 파일을 한 번 등록하세요. 실제 재생시간으로 일차를 자동 연결하며, 이후 기기 내부에 저장하여 재선택 없이 재생합니다. 오른쪽 문장을 누르면 해당 구간이 재생됩니다. 기본은 한 문장 반복입니다. 저장된 영상은 계정이나 다른 기기로 자동 동기화되지 않습니다. 앱에서 영상을 다운로드하거나 GitHub에 배포하지 않습니다.</div></div></section><section class="right"><div class="righthead"><h2 id="lessonTitle">문장 목록</h2><input type="search" id="search" placeholder="문장 검색" aria-label="문장 검색"><button id="reset" class="btn" title="현재 학습 진도 초기화">진도 초기화</button></div><div class="sentences" id="sentences"></div><div class="footer" id="status">준비 중…</div></section></main></div><script src="app.js" defer></script></body></html>
